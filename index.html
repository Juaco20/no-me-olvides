<style>
:root{
  --ink:#3b2626; --green:#e04f73; --green2:#c93d61; --sage:#f3b6c3; --sage2:#fde6ea;
  --cream:#fdf3e9; --paper:#fffaf4; --blue:#8b74d6; --blue2:#ece6fb; --rose:#f2683c; --rose2:#fde2d6;
  --sun:#f8d34a; --mute:#7a6464; --line:#f0e0d0; --danger:#c4422f;
  --r:18px; --shadow:0 1px 2px rgba(59,38,38,.06),0 8px 22px rgba(59,38,38,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.serif{font-family:"Bagel Fat One","Nunito",sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* top nav */
.top{position:sticky;top:0;z-index:20;padding:10px 14px 0}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:8px 10px 8px 22px;flex-wrap:wrap;background:#fffaf4;border-radius:99px;box-shadow:0 6px 20px rgba(59,38,38,.10)}
.brand-logo{height:52px;width:auto;display:block}
.brand{text-decoration:none;color:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:"Bagel Fat One",sans-serif;font-weight:600;font-size:19px}
.brand small{background:var(--sun)!important;color:var(--ink)!important;font-family:"Nunito";font-weight:500;font-size:11px;background:var(--green);color:#fff;border-radius:99px;padding:2px 8px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:99px;color:var(--mute);font-weight:500}
.tabs button.on{background:var(--green);color:#fff}
.reset{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 12px;color:var(--mute);font-size:13px}
.reset:hover{background:var(--paper)}

.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}

/* generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;background:var(--sage2);color:var(--green)}
.btn{border:0;border-radius:99px;font-weight:800;padding:10px 16px;font-weight:600;background:var(--green);color:#fff}
.btn:hover{background:var(--green2)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--sage)}
.btn.ghost:hover{background:var(--sage2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.muted{color:var(--mute)}
.tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center}
.grid{display:grid;gap:16px}

/* ---------- PRESENTACIÓN ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding:24px 0 36px}
.hero h1{font-size:46px;line-height:1.08}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p.lead{font-size:18px;color:#6b5555;max-width:560px;margin:16px 0 24px}
.hero-art{position:relative;aspect-ratio:1/1;max-width:420px;margin-left:auto;border-radius:28px;background:radial-gradient(circle at 30% 30%,#fff 0,var(--blue2) 45%,var(--sage2) 100%);display:grid;place-items:center;overflow:hidden}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 28px}
.flow .card{padding:20px}
.flow .num{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:10px}
.value{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.value .card{padding:22px}
.value h3{font-size:20px;margin-bottom:6px}
.value ul{margin:10px 0 0;padding-left:18px}
.value li{margin:4px 0}
.section-t{font-size:28px;margin:38px 0 6px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.prices .card{padding:22px}
.price{font-family:"Bagel Fat One",sans-serif;font-size:32px;font-weight:600}
.price span{font-family:"Nunito";font-size:14px;color:var(--mute);font-weight:400}
.note{margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--rose2);color:#6b3a2a;font-size:14px}

/* ---------- PANEL PROFESIONAL ---------- */
.pro{display:grid;grid-template-columns:220px 1fr;gap:20px}
.side{padding:14px;position:sticky;top:76px;align-self:start}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;font-size:14px}
.side nav button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--ink);gap:10px;align-items:center}
.side nav button.on{background:var(--sage2);font-weight:600}
.side nav button:hover{background:var(--cream)}
.side .badge{margin-left:auto;background:var(--rose);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px}
.kpi .v{font-family:"Bagel Fat One",sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.kpi .l{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.panel-h h3{font-size:18px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--mute);text-align:left;padding:8px 18px;border-bottom:1px solid var(--line)}
td{padding:11px 18px;border-bottom:1px solid #efe9dd;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf6ee}
.bar{height:6px;border-radius:9px;background:#ece6d9;overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--green2);border-radius:9px}
.signal{display:flex;gap:12px;padding:12px 18px;border-top:1px solid #efe9dd;align-items:flex-start}
.signal:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.det-head{display:flex;gap:16px;align-items:center;padding:20px}
.det-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}
.chip{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;background:var(--blue2);color:#5a43a8}
.refl{padding:14px 18px;border-top:1px solid #efe9dd}
.refl img{max-width:160px;border-radius:10px;display:block;margin-top:8px}
.assigned{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid #efe9dd}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act{padding:16px;display:flex;flex-direction:column;gap:6px}
.act h4{margin:0;font-family:"Bagel Fat One",sans-serif;font-size:17px;font-weight:600}
.typ{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.codebox{font-family:"Bagel Fat One",sans-serif;font-size:40px;letter-spacing:.06em;padding:18px 24px;border:2px dashed var(--sage);border-radius:16px;display:inline-block;background:#fff}
textarea.notes{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;resize:vertical}

/* ---------- APP PACIENTE ---------- */
.pac-onb{max-width:500px;margin:8px auto;padding:18px 22px 24px}
.pac-onb .scr,.pac-main .scr{overflow:visible;padding:0;flex:none}
.pac-main{min-width:0}
.pac-card{padding:22px 28px 28px}
.pac-mhead{display:none;margin:0 2px 10px}
.pac-mhead a{color:var(--green);font-weight:700}
.pac-nav svg{width:20px;height:20px;flex:none}
.sos-side{width:100%;margin-top:12px;border:0;border-radius:99px;background:var(--danger);color:#fff;font-weight:700;padding:10px;cursor:pointer}
.tabbar.pac-tabbar,.sos.pac-sos{display:none}
.pac .moods{justify-content:flex-start;gap:14px;flex-wrap:wrap}
.pac .moods button{width:76px}
.sheet{position:fixed;inset:0;z-index:70;align-items:center;justify-content:center;padding:16px}
.sheet .in{max-width:480px;border-radius:24px;max-height:90vh}
@media (max-width:860px){
  .pac .side{display:none}
  .pac-mhead{display:block}
  .pac-card{padding:16px 16px 22px;border-radius:20px}
  .pac-main{padding-bottom:84px}
  .pac .moods{justify-content:space-between;gap:0}
  .pac .moods button{width:auto;flex:1;max-width:76px}
  .tabbar.pac-tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(59,38,38,.08)}
  .sos.pac-sos{display:block;position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:41}
  .sheet{align-items:flex-end;padding:0}
  .sheet .in{max-width:none;border-radius:26px 26px 0 0}
}
.app-stage{display:grid;grid-template-columns:1fr 400px 1fr;gap:28px;align-items:start}
.app-side{padding-top:30px}
.app-side h2{font-size:26px;margin-bottom:8px}
.phone{width:390px;height:800px;border-radius:44px;background:#3b2626;padding:12px;box-shadow:0 30px 60px rgba(59,38,38,.25);margin:0 auto}
.screen{width:100%;height:100%;border-radius:34px;background:var(--cream);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;flex:none}
.scr{flex:1;overflow-y:auto;padding:6px 18px 18px}
.scr::-webkit-scrollbar{width:0}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--paper);padding:6px 4px 14px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px}
.tabbar button.on{color:var(--green);font-weight:600}
.tabbar svg{width:22px;height:22px}
.a-h{font-family:"Bagel Fat One",sans-serif;font-size:24px;margin:8px 0 2px}
.a-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.moods{display:flex;justify-content:space-between;margin:12px 0 4px}
.moods button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px;border-radius:12px;width:62px}
.moods button.on{background:var(--blue2);color:#5a43a8;font-weight:600}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.emos button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12.5px}
.emos button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.a-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;resize:none}
.a-btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--green);color:#fff;font-weight:600;margin-top:10px}
.a-btn.sec{background:var(--sage2);color:var(--green)}
.a-btn:disabled{opacity:.45;cursor:default}
.from{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.task{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px;cursor:pointer;width:100%;text-align:left}
.task .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:24px;font-weight:700}
.task.done{opacity:.55}
.sos{position:absolute;right:16px;bottom:82px;border:0;border-radius:99px;background:var(--danger);color:#fff;font-weight:600;font-size:12.5px;padding:9px 14px;box-shadow:0 6px 16px rgba(181,82,59,.35);z-index:5}
.sheet{position:absolute;inset:0;background:rgba(22,36,30,.45);display:flex;align-items:flex-end;z-index:10}
.sheet .in{background:var(--paper);width:100%;border-radius:26px 26px 0 0;padding:20px 18px 26px;max-height:92%;overflow:auto}
.help{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px;text-decoration:none;color:inherit}
.help b{font-size:18px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-top:8px}
.opt.on{border-color:var(--green);background:var(--sage2)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #efe9dd}
.sw{width:44px;height:26px;border-radius:99px;background:#d6d0c3;position:relative;border:0;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--green)}
.sw.on::after{left:21px}
.prog{height:7px;background:#ece6d9;border-radius:9px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--blue)}
.steps{margin:10px 0;padding-left:20px}
.steps li{margin:6px 0}
.ev{display:flex;gap:12px;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px}
.ev .d{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--blue2);color:#5a43a8;padding:4px 0;font-weight:600;line-height:1.1}
.ev .d small{display:block;font-size:10px;font-weight:500}
.entry{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px}
.back{border:0;background:none;color:var(--green);font-weight:600;padding:6px 0}
.upl{display:block;border:1.5px dashed var(--sage);border-radius:14px;padding:14px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer;margin-top:8px}
.upl img{max-width:100%;border-radius:10px}

.planbox{margin-top:12px;padding:12px;border-radius:12px;background:var(--cream);border:1px solid var(--line)}
.demo-sw{margin-top:12px;padding:10px 4px 0;border-top:1px dashed var(--line)}
.seg{display:flex;background:var(--cream);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:5px 0;font-size:12px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.upsell{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.lockbox{position:relative;min-height:180px}
.lockbox .blurred{filter:blur(5px);pointer-events:none;user-select:none;opacity:.7}
.lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:linear-gradient(rgba(255,253,248,.55),rgba(255,253,248,.92))}
.lockbox:not(:has(.blurred)) .lockmsg{position:static}
tr.locked td{background:#faf7f0}
tr.locked b{color:var(--mute)}
.act-locked{opacity:.62}
.act-locked:hover{opacity:.9}
.locked-field{width:100%;text-align:left;border:1px dashed var(--sage);background:var(--cream);border-radius:10px;padding:14px;color:var(--mute);font-size:13px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{padding:16px;position:relative;display:flex;flex-direction:column;gap:4px}
.plan .price{font-size:26px}
.plan .btn{margin-top:8px}
.cmp td,.cmp th{padding:8px 10px;font-size:13.5px}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center}
.field{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;margin:4px 0 10px}
@media (max-width:700px){.plans{grid-template-columns:1fr}}
.navwrap{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.user{display:flex;gap:8px;align-items:center}
.uname{font-size:13px;font-weight:600;line-height:1.15}
.uname small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.auth{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:20px 0 40px}
.auth-card{padding:28px;width:100%;max-width:420px}
.auth label{display:block;font-size:12.5px;color:var(--mute)}
.demo-card{padding:22px;width:100%;max-width:380px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:600;margin-top:18px}
.gbtn:hover{background:var(--cream)}
.glogo{width:18px;height:18px;display:block}
.gdot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sage);display:grid;place-items:center;font-size:12px;color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0 8px}
.acct{display:flex;gap:10px;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px}
.acct:hover{border-color:var(--sage);background:#fbf8f1}
.acct code{font-size:12px;background:var(--cream);padding:2px 6px;border-radius:6px}
.demo-warn{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--rose2);color:#6b3a2a;font-size:12.5px}
/* ---------- LANDING ---------- */
.lp-display{font-family:"Bagel Fat One","Nunito",sans-serif;font-weight:400;letter-spacing:.005em;line-height:.98}
.lp{position:relative;overflow:hidden;margin:-24px -20px -60px;padding:0 20px 0}
.lp-hero{position:relative;background:#f38aa0;border-radius:36px;padding:84px 24px 110px;text-align:center;color:#fffaf4;margin-top:8px;overflow:hidden}
.lp-hero h1{font-size:clamp(42px,6.4vw,84px);margin:0;color:#fffaf4;text-shadow:0 3px 0 rgba(59,38,38,.12)}
.lp-hero-p{max-width:620px;margin:18px auto 26px;font-size:18px;line-height:1.5;color:#fff}
.lp-hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lp-hero-st{position:absolute;z-index:1}
.lp-hero-st.st1{left:-10px;top:30px;transform:rotate(-12deg)}
.lp-hero-st.st2{right:-6px;bottom:-14px;transform:rotate(10deg)}
.lp-hero-st.st3{right:120px;top:26px;transform:rotate(14deg)}
.lp-hero h1,.lp-hero-p,.lp-hero-cta{position:relative;z-index:2}
.lp-hero-badge{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);z-index:3;display:grid;place-items:center}
.lp-badge-heart{position:absolute;color:#e04f73;font-size:26px}
.lp-badge.spin{animation:lp-spin 18s linear infinite}
@keyframes lp-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lp-badge.spin{animation:none}}
.lp-btn{border:0;border-radius:99px;padding:13px 26px;font-weight:800;font-size:15px;background:#f8d34a;color:#3b2626;box-shadow:0 4px 0 rgba(59,38,38,.18);transition:transform .15s}
.lp-btn:hover{transform:translateY(-2px)}
.lp-btn.outline{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none}
.lp-btn.ghost-dark{background:transparent;border:2px solid #3b2626;box-shadow:none}
.lp-btn.sm{padding:8px 16px;font-size:13px}
.lp-ribbon-wrap{position:relative;height:0;z-index:4;pointer-events:none}
.lp-ribbon{position:absolute;left:-20px;width:calc(100% + 40px);height:240px}
.lp-ribbon-wrap.r1 .lp-ribbon{top:-120px}
.lp-ribbon-wrap.r2 .lp-ribbon{top:-140px}
.lp-ribbon-t{font-family:"Bagel Fat One",sans-serif;font-size:21px;fill:#3b2626;letter-spacing:.04em}
.lp-for{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:120px 0 40px;position:relative;z-index:2}
.lp-for-card{display:flex;gap:16px;align-items:center;background:#fde6ea;border-radius:24px;padding:16px}
.lp-for-img{width:104px;height:104px;border-radius:18px;background:#fffaf4;display:grid;place-items:center;flex:none}
.lp-for-card h3{font-size:17px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;font-weight:800}
.lp-for-card p{margin:0;font-size:14px;color:#6b5555}
.lp-why{position:relative;text-align:center;padding:40px 0 170px}
.lp-pill{display:inline-block;background:#fde6ea;color:#e04f73;border-radius:99px;padding:5px 16px;font-size:13px;font-weight:700}
.lp-pill.dark{background:#3b2626;color:#fff}
.lp-why-h{font-size:clamp(34px,5vw,64px);color:#3b2626;margin:16px auto 50px;max-width:900px}
.lp-why-st{position:absolute}
.lp-why-st.w1{left:2%;top:70px;transform:rotate(-12deg)}
.lp-why-st.w2{right:3%;top:40px;transform:rotate(12deg)}
.lp-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1120px;margin:0 auto}
.lp-card{position:relative;text-align:left;border-radius:26px;padding:22px 22px 90px;min-height:330px;transform:rotate(var(--rot));box-shadow:0 14px 30px rgba(59,38,38,.14);transition:transform .25s}
.lp-card:hover{transform:rotate(0) translateY(-6px)}
.lp-num{display:inline-block;border:2px solid currentColor;border-radius:99px;padding:1px 10px;font-weight:800;font-size:13px;opacity:.85}
.lp-card h3{font-size:30px;margin:14px 0 12px}
.lp-card p{margin:0;font-size:14.5px;line-height:1.5}
.lp-card-st{position:absolute;right:14px;bottom:10px}
.lp-libsec{position:relative;z-index:2;padding:40px 0 40px}
.lp-sec-h{font-size:clamp(44px,6vw,76px);color:#3b2626;margin:0 0 24px}
.lp-lib{display:grid;grid-template-columns:230px 1fr;gap:22px}
.lp-filters{background:#fde6ea;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px;align-self:start}
.lp-filters b{font-size:14px;margin-bottom:4px}
.lp-check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.lp-check input{accent-color:#e04f73;width:16px;height:16px}
.lp-found{font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lp-chip{background:#fde6ea;color:#e04f73;border-radius:99px;padding:3px 10px;cursor:pointer;font-weight:700;font-size:12.5px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.lp-act{background:#fde6ea;border-radius:22px;padding:10px 10px 16px;text-align:center;display:flex;flex-direction:column}
.lp-act-img{position:relative;border-radius:16px;height:150px;display:grid;place-items:center;overflow:hidden}
.lp-act-glyph{font-size:72px;font-weight:800;line-height:1}
.lp-tag{position:absolute;left:10px;top:10px;color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;transform:rotate(-4deg);display:inline-block}
.lp-act h4{margin:12px 8px 4px;font-size:15px;text-transform:uppercase;font-weight:800;line-height:1.25}
.lp-act-meta{font-size:13px;color:#6b5555}
.lp-act-meta b{color:#e04f73}
.lp-act-row{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:auto;padding-top:12px}
.lp-heart{color:#e04f73;font-size:20px}
.lp-modal{max-width:520px}
.lp-how{padding:40px 0}
.lp-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lp-step{border-radius:26px;padding:24px}
.lp-step-n{font-size:64px;color:#e04f73}
.lp-step h3{margin:6px 0 6px;font-size:19px;font-weight:800}
.lp-step p{margin:0;color:#6b5555}
.lp-plans{padding:40px 0;text-align:center}
.lp-sub{margin:-12px 0 26px;color:#6b5555}
.lp-plan-row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1000px;margin:0 auto}
.lp-plan{border-radius:28px;padding:26px;text-align:left;transform:rotate(var(--rot));box-shadow:0 14px 30px rgba(59,38,38,.12);display:flex;flex-direction:column;gap:10px;border:2px solid rgba(59,38,38,.06)}
.lp-price{font-size:44px}
.lp-price small{font-family:"Nunito",sans-serif;font-size:14px;font-weight:700;margin-left:4px}
.lp-plan ul{margin:0 0 10px;padding-left:18px;line-height:1.6}
.lp-plan h3{font-size:30px;margin:4px 0 0;line-height:1}
.lp-plan p{margin:0;font-size:15px;line-height:1.5}
.lp-plans{scroll-margin-top:90px}
.lp-plans .lp-sub{max-width:760px;margin-left:auto;margin-right:auto}
.lp-pac-note{display:flex;gap:12px;align-items:center;justify-content:center;max-width:760px;margin:34px auto 0;background:#fde6ea;border-radius:99px;padding:10px 22px 10px 12px;text-align:left;font-size:15px}
.lp-pac-note svg{flex:none}
.lp-plan .lp-btn{margin-top:auto;align-self:flex-start}
.lp-plan .lp-pill{align-self:flex-start}
.lp-final{position:relative;background:#8b74d6;border-radius:36px;color:#fff;text-align:center;padding:70px 24px;margin:50px 0 30px;overflow:hidden}
.lp-final h2{font-size:clamp(36px,5vw,62px);margin:0 0 14px}
.lp-final p{margin:0 0 24px;font-size:17px}
.lp-final-st{position:absolute;right:20px;top:-6px;transform:rotate(12deg)}
.lp-foot{text-align:center;color:#6b5555;font-size:14px;padding:0 10px 40px;max-width:820px;margin:0 auto}
.lp-sticker{display:block;overflow:visible}
@media (max-width:980px){
  .lp-cards{grid-template-columns:repeat(2,1fr);gap:26px}
  .lp-for,.lp-steps,.lp-plan-row{grid-template-columns:1fr}
  .lp-lib{grid-template-columns:1fr}
  .lp-hero-st.st3,.lp-why-st{display:none}
}
@media (max-width:620px){
  .lp-cards{grid-template-columns:1fr}
  .lp-hero{padding:70px 18px 100px}
  .lp-hero-st.st1{left:-60px;top:-60px;transform:rotate(-12deg) scale(.55)}
  .lp-hero-st.st2{right:-70px;bottom:-70px;transform:rotate(10deg) scale(.6)}
  .lp-hero{padding-top:90px}
  .lp-card{min-height:0;padding-bottom:96px}
  .top-in{border-radius:24px;padding:8px 12px}
  .lp-ribbon{height:150px}
  .lp-ribbon-wrap.r1 .lp-ribbon{top:-70px}
  .lp-ribbon-wrap.r2 .lp-ribbon{top:-80px}
}

/* ---------- Nomi ---------- */
#nomi{position:fixed;right:18px;bottom:18px;z-index:60;font-family:"Nunito",system-ui,sans-serif}
.nomi-av{border-radius:50%;background:#fffaf4;display:block;object-fit:contain;padding:3px;box-shadow:0 0 0 2px #fde6ea}
.nomi-fab{display:flex;align-items:center;gap:10px;border:0;border-radius:99px;padding:6px 18px 6px 6px;background:#fffaf4;color:var(--ink);box-shadow:0 10px 26px rgba(59,38,38,.18);font-size:14px;cursor:pointer;transition:transform .15s}
.nomi-fab:hover{transform:translateY(-2px)}
.nomi-panel{width:min(370px,calc(100vw - 24px));height:min(560px,calc(100vh - 100px));background:#fffaf4;border-radius:24px;box-shadow:0 18px 48px rgba(59,38,38,.25);display:flex;flex-direction:column;overflow:hidden}
.nomi-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f38aa0;color:#3b2626}
.nomi-head b{display:block;font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:20px;line-height:1}
.nomi-head small{font-size:12px;opacity:.85}
.nomi-x{margin-left:auto;border:0;background:rgba(255,255,255,.55);border-radius:99px;width:30px;height:30px;cursor:pointer;color:#3b2626}
.nomi-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.nomi-msg{max-width:85%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45}
.nomi-msg.bot{background:#fde6ea;align-self:flex-start;border-bottom-left-radius:4px}
.nomi-msg.me{background:#8b74d6;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.nomi-typing{display:flex;gap:4px}
.nomi-typing i{width:7px;height:7px;border-radius:50%;background:#e04f73;animation:nomi-b 1s infinite}
.nomi-typing i:nth-child(2){animation-delay:.15s}.nomi-typing i:nth-child(3){animation-delay:.3s}
@keyframes nomi-b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.nomi-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.nomi-sug button{border:1.5px solid #f3b6c3;background:#fff;color:#c93d61;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.nomi-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #f0e0d0}
.nomi-form input{flex:1;border:1.5px solid #f0e0d0;border-radius:99px;padding:9px 14px;font:inherit;font-size:14px;background:#fff;min-width:0}
.nomi-form input:focus{outline:none;border-color:#e04f73}
.nomi-foot{font-size:11px;color:#7a6464;padding:0 14px 10px;text-align:center}
@media (max-width:620px){#nomi{right:10px;bottom:10px}.nomi-fab span{display:none}.nomi-fab{padding:6px}}
.nomi-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
/* ---------- jardín ---------- */
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.gnav{display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:4px}
.gnav b{min-width:128px;text-align:center;font-size:14px}
.gnav button{border:0;background:#fff;border-radius:50%;width:30px;height:30px;font-size:18px;line-height:1;color:var(--ink);cursor:pointer}
.gnav button:disabled{opacity:.35;cursor:default}
.gwrap{position:relative;margin-top:14px;border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(59,38,38,.06)}
.gscene{display:block;width:100%;height:auto;aspect-ratio:1000/360;min-height:220px}
.gf{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
.gscene.anim .gf{animation:g-grow .7s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
.gf:hover{filter:brightness(1.06)}
.gf.on{filter:drop-shadow(0 0 6px rgba(224,79,115,.55))}
@keyframes g-grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.gtoday{cursor:pointer;animation:g-pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes g-pulse{50%{transform:scale(1.12)}}
.gsun.on{transform-box:fill-box;transform-origin:center;animation:g-spin 40s linear infinite}
@keyframes g-spin{to{transform:rotate(360deg)}}
.gcloud{animation:g-drift 26s ease-in-out infinite alternate}.gcloud.c2{animation-duration:34s}
@keyframes g-drift{to{transform:translateX(60px)}}
.gbf{animation:g-fly 9s ease-in-out infinite}
@keyframes g-fly{0%,100%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(30px,-16px) rotate(6deg)}50%{transform:translate(60px,4px) rotate(-4deg)}75%{transform:translate(24px,14px) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.gf,.gtoday,.gsun.on,.gcloud,.gbf{animation:none}}
.gempty{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(255,250,244,.92);border-radius:18px;padding:14px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:86%;box-shadow:0 8px 20px rgba(59,38,38,.1)}
.gempty span{font-size:13px;color:var(--mute)}
.gdet{display:flex;gap:14px;align-items:flex-start}
.gcap::first-letter{text-transform:uppercase}
.gnote{margin:8px 0 0;font-style:italic;color:#5a4545}
.gchip{display:inline-block;background:var(--blue2);color:#5a43a8;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.gst{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;font-size:12.5px;color:var(--mute);min-height:92px}
.gst .lp-display{font-size:32px;color:var(--ink)}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.gcal>b{font-size:11px;text-align:center;color:var(--mute);font-weight:700}
.gcal button{border:0;background:#fff;border-radius:12px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0;gap:0;font-size:11px;color:var(--mute);cursor:default}
.gcal button.has{cursor:pointer;color:var(--ink);font-weight:700}
.gcal button.has:hover{background:var(--blue2)}
.gcal button.on{box-shadow:0 0 0 2px #e04f73 inset}
.gcal button.today{box-shadow:0 0 0 2px #f8d34a inset;cursor:pointer}
.gcal button:disabled{background:transparent}
.gcal em{width:5px;height:5px;border-radius:50%;background:#e7dccf;margin-top:9px}
.gmiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gmiles div{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px;border-radius:14px;background:#fff;border:1px dashed var(--line);opacity:.6}
.gmiles div.ok{opacity:1;border:1px solid #f3b6c3;background:#fde6ea}
.gmiles span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--cream);font-weight:800;font-size:13px;margin-bottom:4px}
.gmiles .ok span{background:#e04f73;color:#fff}
.gmiles b{font-size:13px}.gmiles small{font-size:11px;color:var(--mute)}
/* ---------- álbum ---------- */
.alb-f{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.alb-f button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
.alb-f button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.alb-grid{columns:3 220px;column-gap:12px;margin-top:14px}
.alb-card{break-inside:avoid;display:block;width:100%;margin:0 0 12px;border:0;padding:0;background:#fff;border-radius:18px;overflow:hidden;text-align:left;cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(59,38,38,.06),0 6px 16px rgba(59,38,38,.06);transition:transform .15s}
.alb-card:hover{transform:translateY(-3px)}
.alb-card img{display:block;width:100%;height:auto}
.alb-txt{padding:18px 16px 14px;min-height:120px}
.alb-txt span{font-size:26px;font-weight:800}
.alb-txt p{margin:6px 0 0;color:var(--ink);font-size:14.5px;line-height:1.45}
.alb-meta{padding:10px 14px 12px;display:flex;flex-direction:column}
.alb-meta b{font-size:14px}.alb-meta small{font-size:12px;color:var(--mute)}
.alb-star{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#fffaf4;color:#e04f73;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px rgba(59,38,38,.15)}
.alb-empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 18px}
.alb-ov{position:fixed;inset:0;z-index:75;background:rgba(40,24,24,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.alb-box{position:relative;background:var(--paper);border-radius:24px;max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.alb-close{position:absolute;top:12px;right:12px;z-index:2;background:rgba(255,250,244,.9)}
.alb-big{display:block;width:100%;max-height:60vh;object-fit:contain;background:#2b1f1f}
.alb-body{padding:18px 20px 20px}
.alb-full{font-size:15px;line-height:1.55;margin:8px 0 4px}
.alb-show{position:fixed;inset:0;z-index:80;background:var(--cream);display:flex;flex-direction:column;padding:16px 20px calc(16px + env(safe-area-inset-bottom))}
.alb-show-top{display:flex;align-items:center;gap:12px}.alb-show-top span{color:var(--mute);font-size:13px;margin-left:auto}
.alb-show-main{flex:1;min-height:0;display:flex;gap:28px;align-items:center;justify-content:center;padding:18px 0}
.alb-show-main img{max-height:100%;max-width:58%;object-fit:contain;border-radius:18px;box-shadow:0 18px 40px rgba(59,38,38,.2)}
.alb-show-txt{max-width:520px;overflow:auto;max-height:100%}.alb-show-txt p{font-size:18px;line-height:1.55}
.alb-show-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.alb-dots{display:flex;gap:6px}.alb-dots i{width:8px;height:8px;border-radius:50%;background:#e7dccf}.alb-dots i.on{background:#e04f73}
.lp-btn:disabled{opacity:.4;cursor:default;transform:none}
/* ---------- centros ---------- */
.lp-ent{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:start;margin:60px 0 10px;scroll-margin-top:90px}
.lp-ent-info{position:relative;background:#fdf1c4;border-radius:32px;padding:34px 30px 40px}
.lp-ent-info h2{font-size:clamp(36px,4.6vw,56px);color:var(--ink);margin:14px 0 10px}
.lp-ent-info p{font-size:16.5px;margin:0 0 14px}
.lp-ent-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.lp-ent-list li{padding-left:30px;position:relative;font-size:15px;line-height:1.45}
.lp-ent-list li::before{content:"✓";position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;background:#e04f73;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.lp-ent-st{position:absolute;right:-14px;top:-26px;transform:rotate(12deg)}
.lp-ent-form{background:#fffaf4;border-radius:32px;padding:28px;box-shadow:0 14px 34px rgba(59,38,38,.10)}
.lp-ent-form h3{margin:0 0 14px;font-size:22px}

function flower(level, size = 40) {
  // level 1..5 (null = gris). Flor original de 5 pétalos que se abre con el ánimo.
  const lv = level || 0;
  const cols = ["#d9cfc4", "#c9b8e6", "#b4a0e2", "#9f88dc", "#8b74d6", "#7a60cf"];
  const c = cols[lv];
  const sc = lv ? 0.45 + lv * 0.11 : 0.5;
  const droop = lv === 1 ? 18 : 0;
  let petals = "";
  for (let i = 0; i < 5; i++) {
    const a = i * 72 + droop;
    petals += `<ellipse cx="0" cy="-11" rx="7.5" ry="10" fill="${c}" opacity="${lv ? .92 : .6}" transform="rotate(${a}) scale(${sc})"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="-24 -24 48 48" aria-hidden="true">${petals}<circle r="${4 * sc + 1.5}" fill="${lv ? "#e9c46a" : "#ddd6c8"}"/><circle r="${1.6 * sc + .6}" fill="#fffdf8" opacity=".8"/></svg>`;
}

const PRO_FIELDS = ["assigned", "next"];
const PAC_FIELDS = ["name", "color", "obj", "since", "age", "emos", "sos", "lastDay", "mood", "done"];
function toRemote(p) {
  const mood = {};
  p.mood.forEach((v, i) => { if (v != null) mood[String(TODAYN - 13 + i)] = v; });
  return {name: p.name || "", color: p.color || "#8b74d6", obj: p.obj || "Por definir", since: p.since || "", next: p.next || "Por agendar", age: p.age || "",

    assigned: (p.assigned || []).map(x => ({a: x.a, note: x.note || "", day: TODAYN - x.date}))};
}
function fromRemote(id, r) {
  const mood = Array(14).fill(null);
  Object.entries(r.mood || {}).forEach(([k, v]) => { const i = Number(k) - (TODAYN - 13); if (i >= 0 && i < 14) mood[i] = v; });
  return {id, name: r.name || "Paciente", color: r.color || "#8b74d6", obj: r.obj || "Por definir", since: r.since || "", next: r.next || "Por agendar", age: r.age || "",
    emos: r.emos || {}, sos: !!r.sos, lastActive: r.lastDay != null ? TODAYN - r.lastDay : 99, mood,
    done: (r.done || []).map(d => ({a: d.a, date: TODAYN - d.day, text: d.text || "", shared: !!d.shared, img: d.img || null})),
    assigned: (r.assigned || []).map(x => ({a: x.a, note: x.note || "", date: TODAYN - x.day})), notes: notesMap[id] || ""};
}
function toRemoteApp(a) {
  const keep = {onboarded: a.onboarded, step: a.step, consent: a.consent, answers: a.answers, profile: a.profile, joined: a.joined,
    journal: (a.journal || []).map(j => ({day: TODAYN - j.date, text: j.text, shared: !!j.shared})),

  return JSON.parse(JSON.stringify(keep));
}
function fromRemoteApp(r) {
  const a = defaultApp();
  if (!r) return a;
  Object.assign(a, {onboarded: !!r.onboarded, step: r.step || 1, consent: r.consent || a.consent, answers: r.answers || [], profile: r.profile || null, joined: r.joined || [],

  if (r.checkedDay === TODAYN) { a.checkedToday = true; a.mood = r.mood; a.emos = r.emos || []; }
  return a;
}
const pick = (o, ks) => ks.reduce((a, k) => (k in o ? (a[k] = o[k], a) : a), {});
const stable = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v);
function changed(k, obj) { const s = stable(obj); if (lastSent[k] === s) return false; lastSent[k] = s; return true; }
const fieldsFor = id => S.user && S.user.role === "pro" ? (id.startsWith("demo-") ? PRO_FIELDS.concat(PAC_FIELDS) : PRO_FIELDS) : PAC_FIELDS;

let flushT = null;
function save() { if (!S.uid || !db || !S.user) return; clearTimeout(flushT); flushT = setTimeout(flush, 350); }
async function flush() {
  if (!S.uid || !db || !S.user) return;
  try {
    if (S.user.role === "pro") {
      const pd = {name: S.pro.name, place: S.pro.place, plan: S.pro.plan};
      if (changed("pro", pd)) await F.updateDoc(F.doc(db, "pros", S.uid), pd);
      for (const p of S.patients) {
        const part = pick(toRemote(p), fieldsFor(p.id));
        if (changed("p:" + p.id, part)) await F.updateDoc(F.doc(db, "pros", S.uid, "patients", p.id), part);
        if (changed("n:" + p.id, {text: p.notes || ""})) await F.setDoc(F.doc(db, "pros", S.uid, "notes", p.id), {text: p.notes || ""});
      }
    } else if (S.user.role === "pac" && ME()) {
      const p = ME();
      const part = pick(toRemote(p), PAC_FIELDS);
      if (changed("p:" + p.id, part)) await F.updateDoc(F.doc(db, "pros", S.user.proId, "patients", p.id), part);
      const ap = toRemoteApp(S.app);
      if (changed("app", ap)) await F.setDoc(F.doc(db, "users", S.uid, "private", "app"), ap);
    }
  } catch (e) { console.error(e); Object.keys(lastSent).forEach(k => delete lastSent[k]); toast("No se pudo guardar. Revisa tu conexión e inténtalo de nuevo."); }
}
function liveRender() {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $("#main").contains(a)) { S.pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (S.pendingRender) { S.pendingRender = false; setTimeout(render, 0); } });

function stopListeners() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; notesMap = {}; Object.keys(lastSent).forEach(k => delete lastSent[k]); }
async function onAuth(user) {
  stopListeners();
  S.authUser = user; S.uid = user ? user.uid : null; S.user = null; S.pro = null; S.patients = []; S.me = null; S.app = null; S.needsProfile = false;

  if (S.registering) return;

    const us = await F.getDoc(F.doc(db, "users", user.uid));

  S.user = profile; S.uid = uid;

    const ps = await F.getDoc(F.doc(db, "pros", uid));
    S.pro = {id: uid, ...ps.data()};
    changed("pro", {name: S.pro.name, place: S.pro.place, plan: S.pro.plan});
    unsubs.push(F.onSnapshot(F.collection(db, "pros", uid, "notes"), snap => {
      snap.docs.forEach(d => { notesMap[d.id] = d.data().text || ""; lastSent["n:" + d.id] = stable({text: notesMap[d.id]}); });
      S.patients.forEach(p => { if (notesMap[p.id] != null) p.notes = notesMap[p.id]; });
      liveRender();
    }, e => console.error(e)));
    unsubs.push(F.onSnapshot(F.collection(db, "pros", uid, "patients"), snap => {
      const list = snap.docs.map(d => fromRemote(d.id, d.data()));
      list.sort((a, b) => (a.id.startsWith("demo-") - b.id.startsWith("demo-")) || a.name.localeCompare(b.name));
      list.forEach(p => { lastSent["p:" + p.id] = stable(pick(toRemote(p), fieldsFor(p.id))); lastSent["n:" + p.id] = stable({text: p.notes || ""}); });
      S.patients = list; S.loading = false; liveRender();
    }, e => { console.error(e); S.loading = false; render(); }));
  } else {
    const ps = await F.getDoc(F.doc(db, "pros", profile.proId));
    S.pro = {id: profile.proId, ...ps.data()};
    const ap = await F.getDoc(F.doc(db, "users", uid, "private", "app"));
    S.app = fromRemoteApp(ap.exists() ? ap.data() : null);
    lastSent["app"] = stable(toRemoteApp(S.app));
    S.me = uid;
    albumLoad();
    unsubs.push(F.onSnapshot(F.doc(db, "pros", profile.proId, "patients", uid), snap => {
      if (!snap.exists()) return;
      const p = fromRemote(uid, snap.data());
      lastSent["p:" + uid] = stable(pick(toRemote(p), PAC_FIELDS));
      S.patients = [p]; S.loading = false; liveRender();
    }, e => { console.error(e); S.loading = false; render(); }));
  }
  if (["ingresar", "registro", "perfil", "presentacion"].includes(S.view) || !S.view) S.view = profile.role === "pro" ? "panel" : "app";
  render();
}

async function uniqueCode(name) {
  for (let i = 0; i < 20; i++) {
    const c = "NMO-" + (initials(name) || "XX") + String(Math.floor(10 + Math.random() * 90));
    const ex = await F.getDoc(F.doc(db, "codes", c));
    if (!ex.exists()) return c;
  }
  return "NMO-" + Date.now().toString(36).toUpperCase().slice(-5);
}

/* ================= gráfico ánimo ================= */
function moodChart(p, w = 520, h = 170) {
  const pad = {l:30, r:12, t:12, b:26};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const x = i => pad.l + i * iw / 13, y = v => pad.t + ih - (v - 1) / 4 * ih;
  let grid = "";
  for (let v = 1; v <= 5; v++) grid += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#ece6d9"/><text x="${pad.l - 8}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#8c978f">${v}</text>`;
  let path = "", pen = false, dots = "";
  p.mood.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    path += `${pen ? "L" : "M"}${x(i)},${y(v)} `; pen = true;
    dots += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === 13 ? 5 : 3.5}" fill="${i === 13 ? "#e9c46a" : "#8b74d6"}" stroke="#fff" stroke-width="1.5"><title>${dayLabel(13 - i)}: ${MOODS[v]}</title></circle>`;
  });
  let labels = "";
  for (let i = 0; i < 14; i += 2) labels += `<text x="${x(i)}" y="${h - 6}" font-size="10" text-anchor="middle" fill="#8c978f">${dayLabel(13 - i)}</text>`;
  labels += `<text x="${x(13)}" y="${h - 6}" font-size="10" text-anchor="middle" fill="#1f3a30" font-weight="600">hoy</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Ánimo de los últimos 14 días">${grid}<path d="${path}" fill="none" stroke="#8b74d6" stroke-width="2.2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function spark(p) {
  const w = 90, h = 26;
  let path = "", pen = false;
  p.mood.forEach((v, i) => { if (v == null) { pen = false; return; } path += `${pen ? "L" : "M"}${(i * w / 13).toFixed(1)},${(h - 3 - (v - 1) / 4 * (h - 6)).toFixed(1)} `; pen = true; });
  const li = p.mood.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
  const dot = li == null ? "" : `<circle cx="${(li * w / 13).toFixed(1)}" cy="${(h - 3 - (p.mood[li] - 1) / 4 * (h - 6)).toFixed(1)}" r="2.5" fill="#8b74d6"/>`;
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${path}" fill="none" stroke="#8b74d6" stroke-width="1.8"/>${dot}</svg>`;
}

function render() {

  else if (S.view === "perfil") S.view = u ? (u.role === "pro" ? "panel" : "app") : "ingresar";
  renderNav();
  nomiSync();
  const m = $("#main");
  if (S.loading && (S.view === "panel" || S.view === "app" || S.authUser && !u && !S.needsProfile)) { m.innerHTML = loadingView(); return; }
  if (S.view === "panel" && !(u && u.role === "pro")) S.view = u ? "app" : "ingresar";
  if (S.view === "app" && !(u && u.role === "pac")) S.view = u ? "panel" : "ingresar";
  if ((S.view === "ingresar" || S.view === "registro") && u) S.view = u.role === "pro" ? "panel" : "app";
  if (S.view === "app" && !ME()) { m.innerHTML = loadingView(); return; }
  renderNav();
  m.innerHTML = S.view === "presentacion" ? vPresentacion() : S.view === "panel" ? vPanel() : S.view === "app" ? vApp() : S.view === "registro" ? vRegistro() : S.view === "perfil" ? vPerfil() : vLogin();
  if (location.hash.slice(1) !== S.view) history.replaceState(null, "", "#" + S.view);
  save();
}

async function sendLead(f) {
  const v = Object.fromEntries(new FormData(f).entries()), err = m => { const e = $("#lead-err"); if (e) e.textContent = m; };
  if (v.web) { LEAD.sent = true; render(); return; }
  const col = LEAD.mode === "colabora";
  if (col) { v.centro = "Especialista: " + (v.profesion || ""); v.tipo = "Colaboración: " + (v.modo || ""); v.equipo = "—"; v.cargo = v.profesion || ""; }
  if (!v.nombre.trim() || (col ? !v.profesion || !v.modo : !v.centro.trim() || !v.tipo || !v.equipo)) return err("Completa los campos marcados con *.");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) return err("Revisa tu correo.");
  if (!v.ok) return err("Necesitamos tu autorización para contactarte.");
  if (!db) return err("No pudimos conectarnos. Inténtalo de nuevo en un momento.");
  LEAD.busy = true; err("");
  const btn = f.querySelector("button"); if (btn) { btn.disabled = true; btn.textContent = "Enviando…"; }
  const data = {nombre: v.nombre.trim(), cargo: (v.cargo || "").trim(), centro: v.centro.trim(), tipo: v.tipo, equipo: v.equipo, region: v.region || "", ciudad: (v.ciudad || "").trim(), email: v.email.trim(), telefono: (v.telefono || "").trim(), mensaje: (v.mensaje || "").trim(), creado: new Date().toISOString(), origen: col ? "especialista" : "centro"};
  try { await F.addDoc(F.collection(db, "leads"), data); LEAD.sent = true; LEAD.name = firstName(data.nombre); const el = document.getElementById("lp-centros"); if (el) el.outerHTML = lpCentros(); lpScroll("#lp-centros"); }
  catch (e) { console.error(e); err("No pudimos enviar tu solicitud. Inténtalo de nuevo en un momento."); if (btn) { btn.disabled = false; btn.textContent = col ? "Quiero colaborar" : "Quiero una demo"; } }
  LEAD.busy = false;
}

function appMain() {
  const a = S.app;
  let inner = "";
  if (a.open) inner = appActividad(lib(a.open));
  else if (a.tab === "hoy") inner = appHoy();
  else if (a.tab === "rutas") inner = appRutas();
  else if (a.tab === "diario") inner = appDiario();
  else inner = appComunidad();
  return `<div class="scr" id="scr">${inner}</div>
    <button class="sos" onclick="S.app.sheet='sos';render()">Necesito ayuda</button>
    <nav class="tabbar">${[["hoy","Hoy"],["rutas","Rutas"],["diario","Diario"],["comunidad","Comunidad"]].map(([k, l]) => `<button class="${a.tab === k && !a.open ? "on" : ""}" onclick="S.app.open=null;S.app.tab='${k}';render()">${ICONS[k]}${l}</button>`).join("")}</nav>
    ${a.sheet === "sos" ? appSOS() : ""}`;
}
function appHoy() {
  const me = ME(), a = S.app;
  const pend = me.assigned.filter(as => !me.done.some(d => d.a === as.a && d.date <= as.date));
  const doneAssigned = me.assigned.filter(as => me.done.some(d => d.a === as.a && d.date <= as.date));
  const streak = (() => { let n = 0; for (let i = 13; i >= 0; i--) { if (me.mood[i] != null) n++; else if (i === 13) continue; else break; } return n; })();
  const checkin = a.checkedToday ? `<div class="a-card" style="display:flex;gap:12px;align-items:center">${flower(a.mood, 54)}<div><b>Hoy tu flor está ${MOODS[a.mood].toLowerCase()}</b><div class="tiny muted">${a.emos.length ? a.emos.join(", ") : "Registrado"} · ${streak} día${streak === 1 ? "" : "s"} registrando</div><button class="back" style="padding:4px 0 0" onclick="pacTab('jardin')">Ver mi jardín →</button></div></div>` :
    `<div class="a-card"><b>¿Cómo está tu flor hoy?</b>
      <div class="moods">${[1,2,3,4,5].map(v => `<button class="${a.mood === v ? "on" : ""}" onclick="S.app.mood=${v};render()">${flower(v, 46)}${MOODS[v]}</button>`).join("")}</div>
      ${a.mood ? `<div class="tiny muted" style="margin-top:8px">¿Qué hay en ella? (opcional)</div>
      <div class="emos">${["Calma","Cansancio","Ansiedad","Alegría","Tristeza","Rabia","Gratitud","Soledad"].map(e => `<button class="${a.emos.includes(e) ? "on" : ""}" onclick="toggleEmo('${e}')">${e}</button>`).join("")}</div>
      <textarea class="a-in" rows="2" placeholder="Una línea sobre tu día (solo para ti)" oninput="S.app.moodNote=this.value">${esc(a.moodNote)}</textarea>
      <button class="a-btn" onclick="saveCheckin()">Guardar</button>` : ""}</div>`;
  return `<div class="a-h">Hola, ${esc(me.name.split(" ")[0])}</div><div class="tiny muted">${longDate()}</div>
    ${checkin}
    <div style="margin-top:18px"><b>De tu profesional</b><div class="from" style="margin-top:2px"><span class="av" style="width:18px;height:18px;font-size:9px;background:var(--green)">${initials(S.pro.name)}</span>${esc(S.pro.name)}</div></div>
    ${pend.length ? pend.map(as => taskBtn(as)).join("") : `<div class="a-card tiny muted">No tienes actividades pendientes. Puedes explorar una ruta.</div>`}
    ${doneAssigned.map(as => taskBtn(as, true)).join("")}
    <div style="margin-top:18px"><b>Para ti hoy</b></div>
    ${taskBtn({a: a.profile === "Arte" ? "a2" : a.profile === "Lectura" ? "a6" : a.profile === "Música" ? "a8" : "a5"}, false, "Sugerida por tu perfil")}
    <div style="height:50px"></div>`;
}
function taskBtn(as, done = false, label = "") {
  const x = lib(as.a), T = TYPES[x.type];
  return `<button class="task ${done ? "done" : ""}" onclick="openAct('${x.id}')"><span class="ic" style="background:${T.bg};color:${T.c}">${T.i}</span><span style="flex:1"><b style="font-size:14px">${esc(x.t)}</b><span class="tiny muted" style="display:block">${done ? "Completada ✓" : label || `${x.type} · ${x.min} min`}</span>${as.note && !done ? `<span class="tiny" style="display:block;margin-top:3px;color:#5a43a8">“${esc(as.note)}”</span>` : ""}</span></button>`;
}
function toggleEmo(e) { const l = S.app.emos; const i = l.indexOf(e); if (i >= 0) l.splice(i, 1); else l.push(e); render(); }
function saveCheckin() {
  const me = ME(), a = S.app;
  if (a.consent.checkins) { me.mood[13] = a.mood; a.emos.forEach(e => me.emos[e] = (me.emos[e] || 0) + 1); }
  me.lastActive = 0; a.checkedToday = true;
  if (!a.garden) a.garden = {};
  a.garden[TODAYN] = {m: a.mood, e: (a.emos || []).slice(), n: (a.moodNote || "").trim().slice(0, 280)};
  render(); toast(a.consent.checkins ? "Guardado. Tu profesional verá cómo estuvo tu semana." : "Guardado solo para ti.");
}
function openAct(id) { S.app.open = id; S.app.actText = ""; S.app.actImg = null; S.app.actShared = true; render(); const s = $("#scr"); if (s) s.scrollTop = 0; window.scrollTo(0, 0); }
function appActividad(x) {
  const T = TYPES[x.type], a = S.app, me = ME();
  const as = me.assigned.find(z => z.a === x.id);
  return `<button class="back" onclick="S.app.open=null;render()">← Volver</button>
    <div class="a-card" style="background:${T.bg};border-color:transparent;margin-top:4px"><span class="typ" style="color:${T.c}">${T.i} ${x.type} · ${x.min} min</span><div class="a-h" style="font-size:22px">${esc(x.t)}</div><div style="font-size:14px">${esc(x.d)}</div>
    ${as && as.note ? `<div class="from" style="margin-top:10px;color:#5a43a8">${esc(firstName(S.pro.name))} te dejó: “${esc(as.note)}”</div>` : ""}</div>
    <div class="a-card"><b style="font-size:14px">Paso a paso</b><ol class="steps" style="font-size:14px">${x.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
    <div class="a-card"><b style="font-size:14px">${esc(x.q)}</b>
      <textarea class="a-in" rows="3" style="margin-top:8px" placeholder="Escribe lo que quieras…" oninput="S.app.actText=this.value">${esc(a.actText)}</textarea>
      <label class="upl">${a.actImg ? `<img src="${a.actImg}" alt="Tu creación">` : "＋ Subir una foto de tu creación (opcional)"}<input type="file" accept="image/*" class="hidden" onchange="pickImg(this)"></label>
      <div class="tog" style="border:0;padding-bottom:0"><div><b style="font-size:14px">Compartir con mi profesional</b><div class="tiny muted">Lo verá antes de tu próxima sesión</div></div><button class="sw ${a.actShared ? "on" : ""}" aria-pressed="${a.actShared}" aria-label="Compartir con mi profesional" onclick="S.app.actShared=!S.app.actShared;render()"></button></div>
    </div>
    <button class="a-btn" onclick="finishAct('${x.id}')">Marcar como hecha</button><div style="height:60px"></div>`;
}
function pickImg(inp, target) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  const shrink = (img, max, q) => { const c = document.createElement("canvas"); const k = Math.min(1, max / Math.max(img.width, img.height)); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
  r.onload = () => { const img = new Image(); img.onload = () => {
    if (target === "alb") { if (S.app.albDraft) S.app.albDraft.img = shrink(img, 1000, .74); }
    else { S.app.actImg = shrink(img, 1000, .74); S.app.actImgSm = shrink(img, 360, .7); }
    render(); }; img.src = r.result; };
  r.readAsDataURL(f);
}
function finishAct(id) {
  const me = ME(), a = S.app;
  const shared = a.actShared && a.consent.actividades;
  me.done.push({a: id, date: 0, text: shared ? a.actText.trim() : "", shared, img: shared ? (a.actImgSm || a.actImg) : null});
  if (a.actText.trim() || a.actImg) albPut({id: "alb_" + Date.now().toString(36), kind: "act", a: id, type: lib(id).type, title: lib(id).t, text: a.actText.trim(), img: a.actImg, day: TODAYN, session: false, ts: Date.now()});
  if (!shared) a.journal.unshift({date: 0, text: `${lib(id).t}: ${a.actText.trim() || "completada"}`, shared: false});
  me.lastActive = 0; a.open = null; a.actImg = null; a.actImgSm = null;
  render(); toast((shared ? `¡Bien hecho! ${firstName(S.pro.name)} lo verá antes de tu próxima sesión.` : "¡Bien hecho! Quedó guardado en tu diario.") + (a.actText.trim() || S.app.album[0] && S.app.album[0].ts > Date.now() - 2000 ? " También está en tu álbum." : ""));
}
function appRutas() {
  const r = [
    {t:"Diario creativo de 21 días", d:"Cinco minutos al día para escribir, dibujar o pegar algo.", n:6, of:21, type:"Escritura"},
    {t:"Calmar la mente con color", d:"Diez ejercicios de arte para días de mucha carga.", n:2, of:10, type:"Arte"},
    {t:"Club de lectura: refugios", d:"Cuatro textos breves sobre volver a uno mismo.", n:0, of:4, type:"Lectura"},
  ];
  return `<div class="a-h">Rutas</div><div class="tiny muted">Caminos cortos, curados por expertos</div>
    ${r.map(x => { const T = TYPES[x.type]; return `<div class="a-card"><span class="typ" style="color:${T.c}">${T.i} ${x.type}</span><div style="font-family:'Bagel Fat One',sans-serif;font-size:18px;font-weight:600">${x.t}</div><div class="tiny muted">${x.d}</div><div class="prog"><i style="width:${x.n / x.of * 100}%"></i></div><div class="tiny muted" style="margin-top:4px">${x.n} de ${x.of}</div></div>`; }).join("")}
    <div style="margin-top:16px"><b>Toda la biblioteca</b></div>
    ${LIB.map(x => taskBtn({a: x.id})).join("")}<div style="height:50px"></div>`;
}
function appDiario() {
  const a = S.app;
  return `<div class="a-h">Mi diario</div><div class="tiny muted">Privado por defecto</div>
    <div class="a-card"><textarea class="a-in" rows="4" placeholder="¿Qué quieres dejar acá hoy?" oninput="S.app.draft=this.value">${esc(a.draft)}</textarea>
      <div class="tog" style="border:0;padding-bottom:0"><div class="tiny">Compartir esta entrada con mi profesional</div><button class="sw ${a.draftShared ? "on" : ""}" aria-pressed="${a.draftShared}" aria-label="Compartir esta entrada" onclick="S.app.draftShared=!S.app.draftShared;render()"></button></div>
      <button class="a-btn" onclick="saveEntry()">Guardar entrada</button></div>
    ${a.journal.map(e => `<div class="entry"><div class="tiny muted">${e.date === 0 ? "Hoy" : fmtDate(e.date)} ${e.shared ? "· Compartida" : "· Privada"}</div><div style="font-size:14px;margin-top:2px">${esc(e.text)}</div></div>`).join("")}
    <div style="height:50px"></div>`;
}
function saveEntry() {
  const a = S.app, t = a.draft.trim(); if (!t) { toast("Escribe algo primero."); return; }
  a.journal.unshift({date: 0, text: t, shared: a.draftShared});
  if (a.draftShared) ME().done.push({a: "a5", date: 0, text: t, shared: true, diario: true});
  ME().lastActive = 0; a.draft = ""; a.draftShared = false; render(); toast("Entrada guardada.");
}
function appComunidad() {
  const ev = [
    {id:"e1", d:"20", m:"nov", t:"Club de lectura online", s:"Jueves 19:30 · Zoom · incluido"},
    {id:"e2", d:"28", m:"nov", t:"Taller presencial: Collage y memoria", s:"Sábado 11:00 · Valparaíso · $15.000"},
    {id:"e3", d:"06", m:"dic", t:"Círculo de escritura", s:"Sábado 17:00 · Santiago · $15.000"},
  ];
  const j = S.app.joined;
  return `<div class="a-h">Comunidad</div><div class="tiny muted">Espacios moderados por facilitadores</div>
    <div class="a-card" style="background:var(--blue2);border-color:transparent"><span class="typ" style="color:#5a43a8">Reto de la semana</span><div style="font-family:'Bagel Fat One',sans-serif;font-size:18px;font-weight:600">Fotografía algo azul que te dé calma</div><div class="tiny muted">142 personas participando</div></div>
    <div style="margin-top:16px"><b>Próximos encuentros</b></div>
    ${ev.map(e => `<div class="ev"><div class="d">${e.d}<small>${e.m}</small></div><div style="flex:1"><b style="font-size:14px">${e.t}</b><div class="tiny muted">${e.s}</div></div><button class="btn sm ${j.includes(e.id) ? "ghost" : ""}" onclick="joinEv('${e.id}')">${j.includes(e.id) ? "Inscrito/a" : "Unirme"}</button></div>`).join("")}
    <div class="a-card tiny muted">Las conversaciones de la comunidad no se comparten con tu profesional.</div><div style="height:50px"></div>`;
}
function joinEv(id) { const j = S.app.joined; const i = j.indexOf(id); if (i >= 0) j.splice(i, 1); else { j.push(id); toast("Te inscribiste. Te avisaremos un día antes."); } render(); }
function appSOS() {
  return `<div class="sheet" onclick="if(event.target===this){S.app.sheet=null;render()}"><div class="in">
    <div class="a-h" style="font-size:22px;margin-top:0">No estás solo ni sola</div>
    <p class="tiny muted" style="margin:4px 0 6px">Si estás en peligro o piensas en hacerte daño, llama ahora. Son gratuitas y atienden las 24 horas.</p>
    <a class="help" href="tel:*4141"><span><b>*4141</b><div class="tiny muted">Línea de prevención del suicidio (Minsal)</div></span><span class="pill" style="background:var(--danger);color:#fff">Llamar</span></a>
    <a class="help" href="tel:131"><span><b>131</b><div class="tiny muted">SAMU, urgencias</div></span><span class="pill" style="background:var(--danger);color:#fff">Llamar</span></a>
    <a class="help" href="tel:6003607777"><span><b>600 360 7777</b><div class="tiny muted">Salud Responde</div></span><span class="pill">Llamar</span></a>
    <button class="a-btn sec" onclick="sosNotify()">Avisar a mi profesional</button>
    <p class="tiny muted" style="margin-top:8px">Tu profesional recibirá un aviso, pero puede que no lo vea de inmediato. No reemplaza a las líneas de arriba.</p>
    <button class="a-btn sec" style="background:none" onclick="S.app.sheet=null;render()">Cerrar</button>
  </div></div>`;
}
function sosNotify() { ME().sos = true; S.app.sheet = null; render(); toast(`Le avisamos a ${firstName(S.pro.name)}. Si es urgente, llama al *4141 o al 131.`); }

/* ================= arranque ================= */
$("#logo").src = LOGO;
const VIEWS = ["presentacion","panel","app","ingresar","registro","perfil"];
function fromHash() { const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h; }
fromHash();
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.view) { S.view = h; render(); } });
render();
(async function boot() {
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
    const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    F = {...authM, ...fsM};
    const app = appM.initializeApp(FB_CONFIG);
    auth = F.getAuth(app); db = F.getFirestore(app);
    F.onAuthStateChanged(auth, onAuth);
  } catch (e) { console.error(e); S.loading = false; render(); toast("No se pudo conectar con el servidor."); }
})();
</script>
</body>
