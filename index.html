<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Me Olvides · Beta para profesionales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f3a30; --green:#2f5d4b; --green2:#3f7461; --sage:#a9bfa6; --sage2:#dfe8dc;
  --cream:#f6f1e7; --paper:#fffdf8; --blue:#5b7fc7; --blue2:#e4ebf8; --rose:#d98e73; --rose2:#f7e4dc;
  --sun:#e9c46a; --mute:#6b7a72; --line:#e4ddcf; --danger:#b5523b;
  --r:14px; --shadow:0 1px 2px rgba(31,58,48,.06),0 6px 20px rgba(31,58,48,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.serif{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* top nav */
.top{position:sticky;top:0;z-index:20;background:rgba(246,241,231,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:600;font-size:19px}
.brand small{font-family:"DM Sans";font-weight:500;font-size:11px;background:var(--green);color:#fff;border-radius:99px;padding:2px 8px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:99px;color:var(--mute);font-weight:500}
.tabs button.on{background:var(--green);color:#fff}
.reset{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 12px;color:var(--mute);font-size:13px}
.reset:hover{background:var(--paper)}

.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}

/* generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;background:var(--sage2);color:var(--green)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--green);color:#fff}
.btn:hover{background:var(--green2)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--sage)}
.btn.ghost:hover{background:var(--sage2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.muted{color:var(--mute)}
.tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center}
.grid{display:grid;gap:16px}

/* ---------- PRESENTACIÓN ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding:24px 0 36px}
.hero h1{font-size:46px;line-height:1.08}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p.lead{font-size:18px;color:#3d5249;max-width:560px;margin:16px 0 24px}
.hero-art{position:relative;aspect-ratio:1/1;max-width:420px;margin-left:auto;border-radius:28px;background:radial-gradient(circle at 30% 30%,#fff 0,var(--blue2) 45%,var(--sage2) 100%);display:grid;place-items:center;overflow:hidden}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 28px}
.flow .card{padding:20px}
.flow .num{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:10px}
.value{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.value .card{padding:22px}
.value h3{font-size:20px;margin-bottom:6px}
.value ul{margin:10px 0 0;padding-left:18px}
.value li{margin:4px 0}
.section-t{font-size:28px;margin:38px 0 6px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.prices .card{padding:22px}
.price{font-family:Fraunces,serif;font-size:32px;font-weight:600}
.price span{font-family:"DM Sans";font-size:14px;color:var(--mute);font-weight:400}
.note{margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--rose2);color:#6b3a2a;font-size:14px}

/* ---------- PANEL PROFESIONAL ---------- */
.pro{display:grid;grid-template-columns:220px 1fr;gap:20px}
.side{padding:14px;position:sticky;top:76px;align-self:start}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;font-size:14px}
.side nav button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--ink);gap:10px;align-items:center}
.side nav button.on{background:var(--sage2);font-weight:600}
.side nav button:hover{background:var(--cream)}
.side .badge{margin-left:auto;background:var(--rose);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px}
.kpi .v{font-family:Fraunces,serif;font-size:30px;font-weight:600;line-height:1.1}
.kpi .l{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.panel-h h3{font-size:18px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--mute);text-align:left;padding:8px 18px;border-bottom:1px solid var(--line)}
td{padding:11px 18px;border-bottom:1px solid #efe9dd;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf6ee}
.bar{height:6px;border-radius:9px;background:#ece6d9;overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--green2);border-radius:9px}
.signal{display:flex;gap:12px;padding:12px 18px;border-top:1px solid #efe9dd;align-items:flex-start}
.signal:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.det-head{display:flex;gap:16px;align-items:center;padding:20px}
.det-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}
.chip{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;background:var(--blue2);color:#2d4a85}
.refl{padding:14px 18px;border-top:1px solid #efe9dd}
.refl img{max-width:160px;border-radius:10px;display:block;margin-top:8px}
.assigned{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid #efe9dd}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act{padding:16px;display:flex;flex-direction:column;gap:6px}
.act h4{margin:0;font-family:Fraunces,serif;font-size:17px;font-weight:600}
.typ{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.codebox{font-family:Fraunces,serif;font-size:40px;letter-spacing:.06em;padding:18px 24px;border:2px dashed var(--sage);border-radius:16px;display:inline-block;background:#fff}
textarea.notes{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;resize:vertical}

/* ---------- APP PACIENTE ---------- */
.app-stage{display:grid;grid-template-columns:1fr 400px 1fr;gap:28px;align-items:start}
.app-side{padding-top:30px}
.app-side h2{font-size:26px;margin-bottom:8px}
.phone{width:390px;height:800px;border-radius:44px;background:#16241e;padding:12px;box-shadow:0 30px 60px rgba(31,58,48,.25);margin:0 auto}
.screen{width:100%;height:100%;border-radius:34px;background:var(--cream);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;flex:none}
.scr{flex:1;overflow-y:auto;padding:6px 18px 18px}
.scr::-webkit-scrollbar{width:0}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--paper);padding:6px 4px 14px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px}
.tabbar button.on{color:var(--green);font-weight:600}
.tabbar svg{width:22px;height:22px}
.a-h{font-family:Fraunces,serif;font-size:24px;margin:8px 0 2px}
.a-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.moods{display:flex;justify-content:space-between;margin:12px 0 4px}
.moods button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px;border-radius:12px;width:62px}
.moods button.on{background:var(--blue2);color:#2d4a85;font-weight:600}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.emos button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12.5px}
.emos button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.a-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;resize:none}
.a-btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--green);color:#fff;font-weight:600;margin-top:10px}
.a-btn.sec{background:var(--sage2);color:var(--green)}
.a-btn:disabled{opacity:.45;cursor:default}
.from{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.task{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px;cursor:pointer;width:100%;text-align:left}
.task .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:24px;font-weight:700}
.task.done{opacity:.55}
.sos{position:absolute;right:16px;bottom:82px;border:0;border-radius:99px;background:var(--danger);color:#fff;font-weight:600;font-size:12.5px;padding:9px 14px;box-shadow:0 6px 16px rgba(181,82,59,.35);z-index:5}
.sheet{position:absolute;inset:0;background:rgba(22,36,30,.45);display:flex;align-items:flex-end;z-index:10}
.sheet .in{background:var(--paper);width:100%;border-radius:26px 26px 0 0;padding:20px 18px 26px;max-height:92%;overflow:auto}
.help{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px;text-decoration:none;color:inherit}
.help b{font-size:18px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-top:8px}
.opt.on{border-color:var(--green);background:var(--sage2)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #efe9dd}
.sw{width:44px;height:26px;border-radius:99px;background:#d6d0c3;position:relative;border:0;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--green)}
.sw.on::after{left:21px}
.prog{height:7px;background:#ece6d9;border-radius:9px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--blue)}
.steps{margin:10px 0;padding-left:20px}
.steps li{margin:6px 0}
.ev{display:flex;gap:12px;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px}
.ev .d{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--blue2);color:#2d4a85;padding:4px 0;font-weight:600;line-height:1.1}
.ev .d small{display:block;font-size:10px;font-weight:500}
.entry{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px}
.back{border:0;background:none;color:var(--green);font-weight:600;padding:6px 0}
.upl{display:block;border:1.5px dashed var(--sage);border-radius:14px;padding:14px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer;margin-top:8px}
.upl img{max-width:100%;border-radius:10px}

.planbox{margin-top:12px;padding:12px;border-radius:12px;background:var(--cream);border:1px solid var(--line)}
.demo-sw{margin-top:12px;padding:10px 4px 0;border-top:1px dashed var(--line)}
.seg{display:flex;background:var(--cream);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:5px 0;font-size:12px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.upsell{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.lockbox{position:relative;min-height:180px}
.lockbox .blurred{filter:blur(5px);pointer-events:none;user-select:none;opacity:.7}
.lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:linear-gradient(rgba(255,253,248,.55),rgba(255,253,248,.92))}
.lockbox:not(:has(.blurred)) .lockmsg{position:static}
tr.locked td{background:#faf7f0}
tr.locked b{color:var(--mute)}
.act-locked{opacity:.62}
.act-locked:hover{opacity:.9}
.locked-field{width:100%;text-align:left;border:1px dashed var(--sage);background:var(--cream);border-radius:10px;padding:14px;color:var(--mute);font-size:13px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{padding:16px;position:relative;display:flex;flex-direction:column;gap:4px}
.plan .price{font-size:26px}
.plan .btn{margin-top:8px}
.cmp td,.cmp th{padding:8px 10px;font-size:13.5px}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center}
.field{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;margin:4px 0 10px}
@media (max-width:700px){.plans{grid-template-columns:1fr}}
.navwrap{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.user{display:flex;gap:8px;align-items:center}
.uname{font-size:13px;font-weight:600;line-height:1.15}
.uname small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.auth{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:20px 0 40px}
.auth-card{padding:28px;width:100%;max-width:420px}
.auth label{display:block;font-size:12.5px;color:var(--mute)}
.demo-card{padding:22px;width:100%;max-width:380px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:600;margin-top:18px}
.gbtn:hover{background:var(--cream)}
.glogo{width:18px;height:18px;display:block}
.gdot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sage);display:grid;place-items:center;font-size:12px;color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0 8px}
.acct{display:flex;gap:10px;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px}
.acct:hover{border-color:var(--sage);background:#fbf8f1}
.acct code{font-size:12px;background:var(--cream);padding:2px 6px;border-radius:6px}
.demo-warn{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--rose2);color:#6b3a2a;font-size:12.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,36,30,.4);z-index:50;display:grid;place-items:center;padding:20px}
.modal .in{background:var(--paper);border-radius:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;font-size:14px;box-shadow:var(--shadow);max-width:90vw}

@media (max-width:1100px){
  .app-stage{grid-template-columns:1fr}
  .app-side{padding-top:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .hero,.flow,.value,.prices,.two,.det-grid{grid-template-columns:1fr}
  .pro{grid-template-columns:1fr}
  .side{position:static}
  .hero h1{font-size:34px}
  .hero-art{margin:0 auto;max-width:300px}
  .tabs{margin-left:0}
}
@media (max-width:430px){
  .phone{width:100%;height:760px;padding:6px;border-radius:30px}
  .screen{border-radius:26px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span id="logo"></span>No Me Olvides <small>BETA</small></div>
    <div id="nav" class="navwrap"></div>
  </div>
</header>

<main class="wrap" id="main"></main>
<div id="modal-root"></div>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const dayLabel = off => { const d = new Date(TODAY); d.setDate(d.getDate() - off); return `${DIAS[d.getDay()]} ${d.getDate()}`; };
const fmtDate = off => { const d = new Date(TODAY); d.setDate(d.getDate() - off); return `${d.getDate()} ${MESES[d.getMonth()]}`; };

function flower(level, size = 40) {
  // level 1..5 (null = gris). Flor original de 5 pétalos que se abre con el ánimo.
  const lv = level || 0;
  const cols = ["#c9c3b6", "#9aa7b8", "#8ea3c8", "#7593cf", "#5b7fc7", "#4a6fbd"];
  const c = cols[lv];
  const sc = lv ? 0.45 + lv * 0.11 : 0.5;
  const droop = lv === 1 ? 18 : 0;
  let petals = "";
  for (let i = 0; i < 5; i++) {
    const a = i * 72 + droop;
    petals += `<ellipse cx="0" cy="-11" rx="7.5" ry="10" fill="${c}" opacity="${lv ? .92 : .6}" transform="rotate(${a}) scale(${sc})"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="-24 -24 48 48" aria-hidden="true">${petals}<circle r="${4 * sc + 1.5}" fill="${lv ? "#e9c46a" : "#ddd6c8"}"/><circle r="${1.6 * sc + .6}" fill="#fffdf8" opacity=".8"/></svg>`;
}
const MOODS = [null, "Marchita", "Cerrada", "En brote", "Abriéndose", "Florecida"];

const TYPES = {
  "Escritura": {c: "#5b7fc7", bg: "#e4ebf8", i: "✎"},
  "Arte": {c: "#c46a4f", bg: "#f7e4dc", i: "◐"},
  "Lectura": {c: "#2f5d4b", bg: "#dfe8dc", i: "❏"},
  "Música": {c: "#8a6bb5", bg: "#ece4f6", i: "♪"},
  "Cuerpo": {c: "#a5802a", bg: "#f6edd2", i: "◌"}
};

/* ================= biblioteca curada ================= */
const LIB = [

function toRemote(p) {
  const mood = {};
  p.mood.forEach((v, i) => { if (v != null) mood[String(TODAYN - 13 + i)] = v; });
  return {name: p.name || "", color: p.color || "#5b7fc7", obj: p.obj || "Por definir", since: p.since || "", next: p.next || "Por agendar", age: p.age || "",
    emos: p.emos || {}, sos: !!p.sos, lastDay: TODAYN - (p.lastActive ?? 0), mood,
    done: (p.done || []).map(d => ({a: d.a, day: TODAYN - d.date, text: d.text || "", shared: !!d.shared, img: d.img || null})),
    assigned: (p.assigned || []).map(x => ({a: x.a, note: x.note || "", day: TODAYN - x.date}))};
}
function fromRemote(id, r) {
  const mood = Array(14).fill(null);
  Object.entries(r.mood || {}).forEach(([k, v]) => { const i = Number(k) - (TODAYN - 13); if (i >= 0 && i < 14) mood[i] = v; });
  return {id, name: r.name || "Paciente", color: r.color || "#5b7fc7", obj: r.obj || "Por definir", since: r.since || "", next: r.next || "Por agendar", age: r.age || "",
    emos: r.emos || {}, sos: !!r.sos, lastActive: r.lastDay != null ? TODAYN - r.lastDay : 99, mood,
    done: (r.done || []).map(d => ({a: d.a, date: TODAYN - d.day, text: d.text || "", shared: !!d.shared, img: d.img || null})),
    assigned: (r.assigned || []).map(x => ({a: x.a, note: x.note || "", date: TODAYN - x.day})), notes: notesMap[id] || ""};
}
function toRemoteApp(a) {
  const keep = {onboarded: a.onboarded, step: a.step, consent: a.consent, answers: a.answers, profile: a.profile, joined: a.joined,
    journal: (a.journal || []).map(j => ({day: TODAYN - j.date, text: j.text, shared: !!j.shared})),
    checkedDay: a.checkedToday ? TODAYN : null, mood: a.checkedToday ? a.mood : null, emos: a.checkedToday ? a.emos : []};
  return JSON.parse(JSON.stringify(keep));
}
function fromRemoteApp(r) {
  const a = defaultApp();
  if (!r) return a;
  Object.assign(a, {onboarded: !!r.onboarded, step: r.step || 1, consent: r.consent || a.consent, answers: r.answers || [], profile: r.profile || null, joined: r.joined || [],

}
const pick = (o, ks) => ks.reduce((a, k) => (k in o ? (a[k] = o[k], a) : a), {});
const stable = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v);
function changed(k, obj) { const s = stable(obj); if (lastSent[k] === s) return false; lastSent[k] = s; return true; }

let flushT = null;
function save() { if (!S.uid || !db || !S.user) return; clearTimeout(flushT); flushT = setTimeout(flush, 350); }
async function flush() {
  if (!S.uid || !db || !S.user) return;
  try {
    if (S.user.role === "pro") {
      const pd = {name: S.pro.name, place: S.pro.place, plan: S.pro.plan};
      if (changed("pro", pd)) await F.updateDoc(F.doc(db, "pros", S.uid), pd);
      for (const p of S.patients) {
        const part = pick(toRemote(p), fieldsFor(p.id));
        if (changed("p:" + p.id, part)) await F.updateDoc(F.doc(db, "pros", S.uid, "patients", p.id), part);
        if (changed("n:" + p.id, {text: p.notes || ""})) await F.setDoc(F.doc(db, "pros", S.uid, "notes", p.id), {text: p.notes || ""});
      }
    } else if (S.user.role === "pac" && ME()) {
      const p = ME();
      const part = pick(toRemote(p), PAC_FIELDS);
      if (changed("p:" + p.id, part)) await F.updateDoc(F.doc(db, "pros", S.user.proId, "patients", p.id), part);
      const ap = toRemoteApp(S.app);
      if (changed("app", ap)) await F.setDoc(F.doc(db, "users", S.uid, "private", "app"), ap);
    }
  } catch (e) { console.error(e); Object.keys(lastSent).forEach(k => delete lastSent[k]); toast("No se pudo guardar. Revisa tu conexión e inténtalo de nuevo."); }
}

async function loadSession(uid, profile) {
  S.user = profile; S.uid = uid;
  if (profile.role === "pro") {
    const ps = await F.getDoc(F.doc(db, "pros", uid));
    S.pro = {id: uid, ...ps.data()};
    changed("pro", {name: S.pro.name, place: S.pro.place, plan: S.pro.plan});
    unsubs.push(F.onSnapshot(F.collection(db, "pros", uid, "notes"), snap => {
      snap.docs.forEach(d => { notesMap[d.id] = d.data().text || ""; lastSent["n:" + d.id] = stable({text: notesMap[d.id]}); });
      S.patients.forEach(p => { if (notesMap[p.id] != null) p.notes = notesMap[p.id]; });
      liveRender();
    }, e => console.error(e)));
    unsubs.push(F.onSnapshot(F.collection(db, "pros", uid, "patients"), snap => {
      const list = snap.docs.map(d => fromRemote(d.id, d.data()));
      list.sort((a, b) => (a.id.startsWith("demo-") - b.id.startsWith("demo-")) || a.name.localeCompare(b.name));
      list.forEach(p => { lastSent["p:" + p.id] = stable(pick(toRemote(p), fieldsFor(p.id))); lastSent["n:" + p.id] = stable({text: p.notes || ""}); });
      S.patients = list; S.loading = false; liveRender();
    }, e => { console.error(e); S.loading = false; render(); }));
  } else {
    const ps = await F.getDoc(F.doc(db, "pros", profile.proId));
    S.pro = {id: profile.proId, ...ps.data()};
    const ap = await F.getDoc(F.doc(db, "users", uid, "private", "app"));

      if (!snap.exists()) return;
      const p = fromRemote(uid, snap.data());
      lastSent["p:" + uid] = stable(pick(toRemote(p), PAC_FIELDS));

    }, e => { console.error(e); S.loading = false; render(); }));
  }

  render();

/* ================= métricas ================= */
const recentMoods = p => p.mood.filter(v => v != null);
function weekDone(p) { return p.done.filter(d => d.date <= 6).length; }
function adherence(p) {
  const assigned = p.assigned.length + p.done.length;
  const checkins = p.mood.slice(7).filter(v => v != null).length;
  const a = assigned ? p.done.filter(d => d.date <= 13).length / assigned : 0;
  return Math.round((checkins / 7 * 0.6 + Math.min(1, a) * 0.4) * 100);
}
function signals(p) {
  const out = [];
  if (p.sos) out.push({lv:"alta", c:"var(--danger)", t:`Usó el botón de ayuda`, s:"Se le mostraron las líneas *4141 y 131. Pidió que te avisáramos."});
  const last = recentMoods(p).slice(-3);
  if (last.length === 3 && last.every(v => v <= 2)) out.push({lv:"media", c:"var(--rose)", t:"Ánimo bajo en sus últimos 3 registros", s:"Puede ser un tema para la próxima sesión."});
  if (p.lastActive >= 5) out.push({lv:"media", c:"var(--sun)", t:`Sin actividad hace ${p.lastActive} días`, s:"Un mensaje breve suele reactivar el hábito."});
  if (weekDone(p) >= 3) out.push({lv:"buena", c:"var(--green2)", t:`Completó ${weekDone(p)} actividades esta semana`, s:"Buen momento para reconocer el avance."});
  const shared = p.done.filter(d => d.shared && d.date <= 2).length;
  if (shared) out.push({lv:"info", c:"var(--blue)", t:`Compartió ${shared} reflexión${shared>1?"es":""} reciente${shared>1?"s":""}`, s:"Disponible en su ficha."});
  return out;
}
const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

/* ================= gráfico ánimo ================= */
function moodChart(p, w = 520, h = 170) {
  const pad = {l:30, r:12, t:12, b:26};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const x = i => pad.l + i * iw / 13, y = v => pad.t + ih - (v - 1) / 4 * ih;
  let grid = "";
  for (let v = 1; v <= 5; v++) grid += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#ece6d9"/><text x="${pad.l - 8}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#8c978f">${v}</text>`;
  let path = "", pen = false, dots = "";
  p.mood.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    path += `${pen ? "L" : "M"}${x(i)},${y(v)} `; pen = true;
    dots += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === 13 ? 5 : 3.5}" fill="${i === 13 ? "#e9c46a" : "#5b7fc7"}" stroke="#fff" stroke-width="1.5"><title>${dayLabel(13 - i)}: ${MOODS[v]}</title></circle>`;
  });
  let labels = "";
  for (let i = 0; i < 14; i += 2) labels += `<text x="${x(i)}" y="${h - 6}" font-size="10" text-anchor="middle" fill="#8c978f">${dayLabel(13 - i)}</text>`;
  labels += `<text x="${x(13)}" y="${h - 6}" font-size="10" text-anchor="middle" fill="#1f3a30" font-weight="600">hoy</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Ánimo de los últimos 14 días">${grid}<path d="${path}" fill="none" stroke="#5b7fc7" stroke-width="2.2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function spark(p) {
  const w = 90, h = 26;
  let path = "", pen = false;
  p.mood.forEach((v, i) => { if (v == null) { pen = false; return; } path += `${pen ? "L" : "M"}${(i * w / 13).toFixed(1)},${(h - 3 - (v - 1) / 4 * (h - 6)).toFixed(1)} `; pen = true; });
  const li = p.mood.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
  const dot = li == null ? "" : `<circle cx="${(li * w / 13).toFixed(1)}" cy="${(h - 3 - (p.mood[li] - 1) / 4 * (h - 6)).toFixed(1)}" r="2.5" fill="#5b7fc7"/>`;
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${path}" fill="none" stroke="#5b7fc7" stroke-width="1.8"/>${dot}</svg>`;
}

window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.view) { S.view = h; render(); } });
render();
(async function boot() {
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
    const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    F = {...authM, ...fsM};
    const app = appM.initializeApp(FB_CONFIG);
    auth = F.getAuth(app); db = F.getFirestore(app);
    F.onAuthStateChanged(auth, onAuth);
  } catch (e) { console.error(e); S.loading = false; render(); toast("No se pudo conectar con el servidor."); }
})();
</script>
